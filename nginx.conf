server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve /stellarbeauty path
    location /stellarbeauty {
        alias /usr/share/nginx/html/stellarbeauty;
        index index.html;
        try_files $uri $uri/ /stellarbeauty/index.html;
    }

    # Root redirect to /stellarbeauty
    location = / {
        return 301 /stellarbeauty;
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript text/html;
    gzip_min_length 1000;
}
